name: finassist-dev

services:
  postgres:
    container_name: finassist-postgres-dev
    ports: !override
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5433}:5432"
    volumes: !override
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

  backup:
    profiles: ["backup"]

  evolution:
    container_name: finassist-evolution-dev
    ports: !override
      - "${EVOLUTION_DEV_PORT:-8083}:8080"
    volumes: !override
      - evolution_dev_data:/evolution/instances

  redis:
    container_name: finassist-redis-dev
    ports: !override
      - "127.0.0.1:${REDIS_DEV_PORT:-6380}:6379"
    volumes: !override
      - redis_dev_data:/data

  app:
    container_name: finassist-app-dev
    build:
      dockerfile: Dockerfile.dev
    command: ["air", "-c", ".air.toml"]
    ports: !override
      - "127.0.0.1:${APP_DEV_PORT:-3001}:3000"
    volumes:
      - ./backend:/app

  web:
    container_name: finassist-web-dev
    build:
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports: !override
      - "127.0.0.1:${WEB_DEV_PORT:-5173}:5173"
    environment:
      VITE_API_TARGET: http://app:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
  evolution_dev_data:
  redis_dev_data:
  frontend_node_modules:
