root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/finassist ./cmd/main.go"
bin = "tmp/finassist"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test.go"]
poll = true
poll_interval = 1000
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[misc]
clean_on_exit = true
